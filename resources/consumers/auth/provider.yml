provider:
  name: site
  http:
    api:
      prefix: api/v1/auth
      routes:
        - payload: auth:register
          action: auth:register
          method: POST
          pattern: /register
        - payload: auth:login
          action: auth:login
          method: POST
          pattern: /login
        - payload: auth:token
          action: auth:logout
          method: POST
          pattern: /logout
        - payload: user
          action: auth:update
          method: PUT
          pattern: /me
          protected: true
        - payload: default:id
          action: auth:remove
          method: DELETE
          pattern: /me
          protected: true
        - payload: password:request
          action: password:request
          method: POST
          pattern: /request
        - payload: password:reset
          action: password:reset
          method: POST
          pattern: /reset
        - payload: auth:token
          action: auth:confirm
          method: POST
          pattern: /confirm
        - payload: user
          action: auth:show
          method: GET
          pattern: /me
          protected: true
    views:
      prefix: /
      document: admin
      routes:
        - pattern: /
          template: site
        - pattern: /auth
          template: auth
        - pattern: /profile
          template: profile
  jobs:
    - name: tokens:cleanup
      schedule: @daily
      action: tokens:expired
      timeout: 300  # in seconds
  subscribers:
    - topic: before:action
      action: auth:before
    - topic: after:auth:register
      action: email:welcome
    - topic: after:auth:login
      action: email:login:alert
