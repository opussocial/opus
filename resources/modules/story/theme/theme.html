<% define "module-store" %>
  <script>
    const store = PetiteVue.reactive({
      model: {
        stories: [],
        story: {
          id: 0,
          name: "",
          slug: "",
          definitions: [],
          roles: [],
          relationships: [],
          settings: [],
        },
        definition: {
          id: 0,
          name: "",
          slug: "",
        },
        relationship: {
          id: 0,
          name: "",
          slug: "",
          source: "",
          target: "",
        },
        role: {
          id: 0,
          name: "",
          slug: "",
        },
        setting: {
          id: 0,
          name: "",
          slug: "",
          value: "",
        },
      },
      view: {
        screen: "",
        title: "",
        loading: false,
        messages: [],
      },
    });

    const setList = (data) => {
        store.model.stories = data;
    };

    const setModel = (data) => {
        store.model.story = data;
        store.model.role.storyId = data.id;
        store.model.definition.storyId = data.id;
        store.model.relationship.storyId = data.id;
        store.model.setting.storyId = data.id;
    };

    const setDefinition = (data) => {
      store.model.definition = data;
    };

    const setRole = (data) => {
      store.model.role = data;
    };

    const setRelationship = (data) => {
      store.model.relationship = data;
    };

    const setSetting = (data) => {
      store.model.setting = data;
    };

    const onLoadStories = () => {
        def = {
            method: 'get',
            url: '/story',
            event: "stories:loaded",
        }
        return useApi(def);
    }

    const onLoadStory = (slug) => {
        store.view.loading = true;
        def = {
            method: 'get',
            url: '/story/' + slug,
            event: "story:loaded",
        }
        return useApi(def);
    }

    const onCreateStory = () => {
        store.view.loading = true;
        const def = {
            method: "post",
            url: '/story',
            model: store.model.story,
            event: "story:created",
        }
        return useApi(def);
    };

    const onUpdateStory = () => {
        store.view.loading = true;
        const def = {
            method: "put",
            url: '/story/' + store.model.story.slug,
            model: store.model.story,
            event: "story:updated",
        }
        return useApi(def);
    };

    const onDeleteStory = () => {
      store.view.loading = true;
      const def = {
          method: "delete",
          url: '/story/' + store.model.story.slug,
          event: "story:deleted",
      };
      return useApi(def);
    };

    const onAddDefinition = () => {
      store.view.loading = true;
      
      const def = {
          model: store.model.definition,
          method: "post",
          url: '/story/' + store.model.story.slug + '/def',
          event: "definition:created",
      };
      return useApi(def);      
    };

    const onAddRole = (storyId) => {
      store.view.loading = true;
      const def = {
          model: store.model.role,
          method: "post",
          url: '/story/' + store.model.story.slug + '/role',
          event: "role:created",
      };
      return useApi(def);
    };

    const onAddRelationship = (storyId) => {
      store.view.loading = true;
      const def = {
          model: store.model.relationship,
          method: "post",
          url: '/story/' + store.model.story.slug + '/relationship',
          event: "relationship:created",
      };
      return useApi(def);      
    };

    const onAddSetting = () => {
      store.view.loading = true;
      const def = {
          model: store.model.setting,
          method: "post",
          url: '/story/' + store.model.story.slug + '/setting',
          event: "setting:created",
      };
      return useApi(def);      
    };

  </script>
<% end %>

<% define "module-scopes" %>
<% end %>
